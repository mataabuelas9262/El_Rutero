# Puerto de la aplicación
server.port=${PORT:8080}

# Configuración de Base de Datos MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ruta_bus_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de carga y tamaño de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Clave secreta para firmar los JWT (mínimo 256 bits, configurable por variable de entorno)
jwt.secret=${JWT_SECRET:MI_FIRMA_SECRETA_DEFAULT_PARA_DESARROLLO_LOCAL_JWT_RUTABUS_MAZATLAN_2026}
# Expiración del token: 1 día (86400000 ms)
jwt.expiration=86400000
